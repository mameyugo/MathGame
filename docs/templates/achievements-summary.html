<div class="achievements-summary">
    <div class="summary-title">{{summary_title}}</div>
    <div class="summary-stats">
        <div class="summary-stat">
            <span class="stat-value">{{unlocked_count}}</span>
            <span class="stat-label">{{unlocked_label}}</span>
        </div>
        <div class="summary-stat">
            <span class="stat-value">{{total_count}}</span>
            <span class="stat-label">{{total_label}}</span>
        </div>
        <div class="summary-stat">
            <span class="stat-value">{{percentage}}%</span>
            <span class="stat-label">{{completed_label}}</span>
        </div>
    </div>
</div>
