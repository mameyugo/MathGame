<div class="user-card">
    <div class="user-info" onclick="userManager.selectUser('{{name}}')">
        <span><strong>{{name}}</strong> (Lvl {{level}})</span>
        <span>💰 {{coins}}</span>
    </div>
    <button class="btn-play-user" onclick="event.stopPropagation(); userManager.selectUser('{{name}}')"
        data-i18n="btn_play_user">{{play_btn_text}}</button>
</div>
